spring.application.name=backend
server.port=8080

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Use 'validate' in production — schema managed by migrations
# Use 'update' only during initial development
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Disable SQL logging in production to prevent information disclosure
spring.jpa.show-sql=false

spring.mvc.cors.allowed-origins=${SPRING_MVC_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# JWT Configuration — NO hardcoded fallback values
jwt.secret=${JWT_SECRET}
jwt.algorithm=${JWT_ALGORITHM:HmacSHA256}
jwt.expirationtime=${JWT_EXPIRATION_TIME:3600000}

# API Key — NO hardcoded fallback value
app.api-key=${APP_API_KEY}

# Spring active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}