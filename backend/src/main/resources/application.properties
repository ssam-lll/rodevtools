spring.application.name=backend
server.port=8080

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Use 'validate' in production — schema managed by migrations
# Use 'update' only during initial development
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Disable SQL logging in production to prevent information disclosure
spring.jpa.show-sql=false

spring.mvc.cors.allowed-origins=${SPRING_MVC_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://[::1]:*}

# JWT Configuration — NO hardcoded fallback values
jwt.secret=${JWT_SECRET}
jwt.algorithm=${JWT_ALGORITHM:HmacSHA256}
jwt.expirationtime=${JWT_EXPIRATION_TIME:3600000}

# API Key — NO hardcoded fallback value
app.api-key=${APP_API_KEY}

# Spring active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Game Data Scheduler Configuration (Runs every hour)
app.scheduler.game-sync.cron=${GAME_SYNC_CRON:0 0 * * * ?}
app.scheduler.game-sync.cutoff-hours=${GAME_SYNC_CUTOFF_HOURS:6}
app.scheduler.game-sync.batch-size=${GAME_SYNC_BATCH_SIZE:100}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
