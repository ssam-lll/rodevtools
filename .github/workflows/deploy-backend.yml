name: Deploy Backend

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'backend/**'
      - 'scripts/deploy-ec2.sh'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 357633902747.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: rodevtools-backend

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rodevtools
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d rodevtools"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run Gradle test suite
        working-directory: backend
        env:
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/rodevtools
          SUPABASE_DB_USERNAME: postgres
          SUPABASE_DB_PASSWORD: postgres
          JWT_SECRET: ci-test-jwt-secret-key-at-least-32-bytes-long-123456
          APP_API_KEY: ci-test-api-key
        run: ./gradlew test --no-daemon

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:${GITHUB_SHA}" -t "${IMAGE_URI}:latest" ./backend
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          docker push "${IMAGE_URI}:latest"

  deploy-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
    steps:
      - name: Checkout repository
        if: env.AWS_EC2_INSTANCE_ID != ''
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: env.AWS_EC2_INSTANCE_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy container via AWS SSM
        if: env.AWS_EC2_INSTANCE_ID != ''
        run: |
          SCRIPT_B64="$(tr -d '\r' < scripts/deploy-ec2.sh | base64 -w0)"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$AWS_EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"echo '$SCRIPT_B64' | base64 -d > /tmp/deploy-ec2.sh\",\"chmod +x /tmp/deploy-ec2.sh\",\"/tmp/deploy-ec2.sh ${GITHUB_SHA}\"]" \
            --query "Command.CommandId" \
            --output text)"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_EC2_INSTANCE_ID" || true
          INVOCATION="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_EC2_INSTANCE_ID")"
          echo "$INVOCATION" | jq -r '.StandardOutputContent // empty'
          echo "$INVOCATION" | jq -r '.StandardErrorContent // empty' >&2
          STATUS="$(echo "$INVOCATION" | jq -r '.Status')"
          test "$STATUS" = "Success"
